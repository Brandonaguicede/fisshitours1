<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Pura Ruta Adventures crea tours premium de pesca deportiva, navegación, snorkeling, playa y bioluminiscencia en Costa Rica."
    />
    <meta name="theme-color" content="#0A1719" />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="image" href="/images/papagayo-logo.png" />
    <title>Pura Ruta Adventures</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('pft-admin-theme');
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.dataset.theme = theme;
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body style="margin:0;background:#0B2842">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
